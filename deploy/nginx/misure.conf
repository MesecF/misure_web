# nginx in front of the application (Docker on 10.24.131.36, port 8084). Example for when the
# domain and HTTPS are set up; nginx may run on another server.
# Copy to /etc/nginx/conf.d/misure.conf, replace the domain and certificate paths, then:
#   nginx -t && systemctl reload nginx
# On RHEL/AlmaLinux, SELinux must allow nginx to connect to the application (once):
#   setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    server_name misure.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name misure.example.com;

    ssl_certificate     /etc/pki/tls/certs/misure.crt;
    ssl_certificate_key /etc/pki/tls/private/misure.key;

    # Article CSV import
    client_max_body_size 20m;

    location / {
        proxy_pass http://10.24.131.36:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large exports; a little longer than gunicorn's timeout (120 s)
        proxy_read_timeout 130s;
    }
}
